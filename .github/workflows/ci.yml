name: Continuous Integration & Clinical Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests & Sepsis Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Clinical Determinism Unit Tests
        run: |
          python -m unittest discover tests -v

      - name: Run 25-Patient PhysioNet Clinical Audit
        run: |
          python scripts/run_benchmarks.py
