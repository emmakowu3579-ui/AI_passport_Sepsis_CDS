name: Continuous Integration & Clinical Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests & Sepsis Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python with uv
        run: |
          uv python install 3.10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Client JS Module Syntax
        run: |
          node --check app/js/predictiveModel.js
          node --check app/js/tourGuide.js

      - name: Run Clinical Determinism & Predictive Parity Unit Tests
        run: |
          uv run python -m unittest discover -s tests -v

      - name: Run HTTP Static Server & Data Contract Smoke Test
        run: |
          uv run python scripts/test_server.py

      - name: Run 25-Patient PhysioNet Clinical Audit
        run: |
          uv run python scripts/run_benchmarks.py
