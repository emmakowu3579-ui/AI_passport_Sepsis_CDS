server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Standard MIME types
    include /etc/nginx/mime.types;
    types {
        application/javascript js mjs;
        application/json json;
        image/svg+xml svg;
    }

    # Gzip compression for instantaneous transfer of large cohort and knowledge indices
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Same-origin Ollama reverse proxy for Docker Compose & GitHub Codespaces.
    # Docker DNS + variable proxy_pass keeps Nginx bootable even without the ollama container.
    location /api/ollama/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $ollama_backend http://ollama:11434;
        rewrite ^/api/ollama/(.*)$ /$1 break;
        proxy_pass $ollama_backend;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Lightweight healthcheck endpoint
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
}
